apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mr-do-openhab
  name: mr-do-openhab
  labels:
    app: mr-do-openhab
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mr-do-openhab
  template:
    metadata:
      labels:
        app: mr-do-openhab
    spec:
      # nodeSelector:
      #   cputype: arm64
      securityContext:
        fsGroup: 9001
        # openHAB entrypoint starts as root to set timezone and fix volume
        # permissions, then drops to the openhab user (9001) via su-exec.
        # runAsNonRoot would prevent this startup sequence.
      containers:
        - name: openhab
          image: openhab/openhab:5.2.1-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8443
              protocol: TCP
            - containerPort: 5683
              protocol: UDP
            - containerPort: 5684
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Berlin
            # Extra JVM options (appended by the openHAB start script):
            # - user.timezone: JVM-level timezone (controls cron rules, timestamps)
            # - MaxRAMPercentage=50.0: max heap = 50% of the memory limit (1 GiB of 2 GiB).
            #   Without it the JVM default is 25% (512 MiB), which ran out of heap
            #   (java.lang.OutOfMemoryError: Java heap space, container killed 2026-08-12).
            # - ExitOnOutOfMemoryError: exit on OOM instead of running on with dead
            #   core threads; Kubernetes restarts the container.
            - name: EXTRA_JAVA_OPTS
              value: "-Duser.timezone=Europe/Berlin -XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 500m
              # Resident memory of the running JVM is ~0.9-1.0 GiB.
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            # --- /openhab/conf/* : user configuration only ---
            - name: openhab-data
              mountPath: /openhab/conf/items
              subPath: openhab/conf/items
            - name: openhab-data
              mountPath: /openhab/conf/things
              subPath: openhab/conf/things
            - name: openhab-data
              mountPath: /openhab/conf/rules
              subPath: openhab/conf/rules
            - name: openhab-data
              mountPath: /openhab/conf/scripts
              subPath: openhab/conf/scripts
            - name: openhab-data
              mountPath: /openhab/conf/sitemaps
              subPath: openhab/conf/sitemaps
            - name: openhab-data
              mountPath: /openhab/conf/services
              subPath: openhab/conf/services
            - name: openhab-data
              mountPath: /openhab/conf/persistence
              subPath: openhab/conf/persistence
            - name: openhab-data
              mountPath: /openhab/conf/transform
              subPath: openhab/conf/transform
            - name: openhab-data
              mountPath: /openhab/conf/html
              subPath: openhab/conf/html
            - name: openhab-data
              mountPath: /openhab/conf/icons/classic
              subPath: openhab/conf/icons/classic
            # JSR223 + Blockly + all automation scripts
            - name: openhab-data
              mountPath: /openhab/conf/automation
              subPath: openhab/conf/automation
            # Custom sound files (alarm, doorbell, etc)
            - name: openhab-data
              mountPath: /openhab/conf/sounds
              subPath: openhab/conf/sounds
            # exec.whitelist (which external commands can be called from rules)
            - name: openhab-data
              mountPath: /openhab/conf/misc
              subPath: openhab/conf/misc
            # --- /openhab/userdata : complete userdata (state, etc, cache, tmp, logs) ---
            # The image expects the whole userdata directory to be persistent:
            # - the entrypoint compares userdata/etc/version.properties with the
            #   image and, after an image version change, backs up userdata and runs
            #   runtime/bin/update + the upgrade tool (JSON database migrations);
            # - restarts keep cache/tmp, so add-ons are not re-installed on every
            #   start (a cache-cleared start refreshes the DSL script engine and
            #   breaks UI rules with inline DSL scripts, openhab-core #4813/#5221).
            - name: openhab-data
              mountPath: /openhab/userdata
              subPath: openhab/userdata
            # --- /openhab/addons : manual add-ons ---
            - name: openhab-data
              mountPath: /openhab/addons
              subPath: openhab/addons
      volumes:
        - name: openhab-data
          persistentVolumeClaim:
            claimName: mr-do-openhab-pvc-data
