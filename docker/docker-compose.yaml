services:
  #mqtt
  mosquitto:
    container_name: mqtt
    restart: always
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mqtt/data:/mosquitto/data
    networks:
      - default

  openhab:
    container_name: openhab
    image: openhab/openhab:5.2.2-alpine
    restart: always
    # Same ports as the Kubernetes Service (web UI HTTP/HTTPS, Shelly CoIoT, CoAP secure).
    ports:
      - 8080:8080
      - 8443:8443
      - 5683:5683/udp
      - 5684:5684
    volumes:
      # --- /openhab/conf/* : user configuration only ---
      - ./openhab/conf/items:/openhab/conf/items
      - ./openhab/conf/things:/openhab/conf/things
      - ./openhab/conf/rules:/openhab/conf/rules
      - ./openhab/conf/scripts:/openhab/conf/scripts
      - ./openhab/conf/sitemaps:/openhab/conf/sitemaps
      - ./openhab/conf/services:/openhab/conf/services
      - ./openhab/conf/persistence:/openhab/conf/persistence
      - ./openhab/conf/transform:/openhab/conf/transform
      - ./openhab/conf/html:/openhab/conf/html
      - ./openhab/conf/icons/classic:/openhab/conf/icons/classic
      - ./openhab/conf/automation:/openhab/conf/automation
      - ./openhab/conf/sounds:/openhab/conf/sounds
      - ./openhab/conf/misc:/openhab/conf/misc
      # --- /openhab/userdata : complete userdata (state, etc, cache, tmp, logs) ---
      # Must be one persistent directory: the image's entrypoint upgrades it
      # (backup + runtime/bin/update + upgrade tool) when the image version changes,
      # and keeping cache/tmp avoids re-installing all add-ons on every start.
      - ./openhab/userdata:/openhab/userdata
      # --- /openhab/addons : manual add-ons ---
      - ./openhab/addons:/openhab/addons
    environment:
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
      TZ: Europe/Berlin
      # enableSessionTicketExtension=false: the JDK otherwise sends an empty TLS 1.3
      # session ticket that clients reject, so HTTPS on 8443 fails (see README).
      EXTRA_JAVA_OPTS: "-Duser.timezone=Europe/Berlin -Djdk.tls.server.enableSessionTicketExtension=false"
    networks:
      - default

networks:
  default:
